name: fuzz
# Nightly fuzzing of the parsers that read untrusted bytes. Add a row to the
# matrix for each new target.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/relay/wire, target: FuzzReadProxyV2, time: 60s }
          - { pkg: ./internal/relay/wire, target: FuzzHello, time: 60s }
          - { pkg: ./internal/relay/wire, target: FuzzRelayMessages, time: 60s }
          - { pkg: ./internal/relay/server, target: FuzzPeekClientHello, time: 5m }
          - { pkg: ./internal/cloud, target: FuzzParseEntry, time: 60s }
          - { pkg: ./internal/cloud, target: FuzzParseKey, time: 60s }
          - { pkg: ./internal/cloud, target: FuzzParseLinkRecord, time: 60s }
          - { pkg: ./internal/cloud, target: FuzzAnswer, time: 60s }
          - { pkg: ./internal/sigv4, target: FuzzCanonicalQuery, time: 60s }
          - { pkg: ./internal/sigv4, target: FuzzSign, time: 60s }
          - { dir: cloud, pkg: ./internal/billing, target: FuzzParseSignature, time: 60s }
          - { dir: cloud, pkg: ./internal/billing, target: FuzzParseEvent, time: 60s }
          - { dir: cloud, pkg: ./internal/billing, target: FuzzVerifyWebhook, time: 60s }
          - { dir: cloud, pkg: ./internal/server, target: FuzzAllowedHandle, time: 60s }
          - { dir: cloud, pkg: ./internal/dns, target: FuzzHandleCAA, time: 60s }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=${{ matrix.time }} ${{ matrix.pkg }}
        working-directory: ${{ matrix.dir || '.' }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.target }}
          path: ${{ matrix.dir || '.' }}/${{ matrix.pkg }}/testdata/fuzz
