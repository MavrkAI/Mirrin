name: labels
# Creates or updates the labels listed in .github/labels.yml, so the issue
# templates never apply a label that doesn't exist. Labels not in the file are
# left alone.
on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yq -r '.[] | [.name, .color, .description] | @tsv' .github/labels.yml |
            while IFS="$(printf '\t')" read -r name color description; do
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description" --force
            done
