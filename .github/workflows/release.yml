name: release
# Push a tag vX.Y.Z to release it (docs/maintainers-release.md). Every file is
# built once on the platform it's for, checked against its name, listed in
# SHA256SUMS, signed with Sigstore, attested by GitHub and uploaded by a
# single job, so nothing races and nothing is mislabelled. Tags are never
# moved: fix forward.
#
# Nothing here builds with -tags wakemodel, so no release carries a
# wake-word model, and the source archive leaves the file out too
# (.gitattributes; docs/wake-word.md says why).
#
# Every action is pinned to a commit, with its version in a comment;
# Dependabot updates both together.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    name: Linux and Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: make dist-portable relay-release VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: portable, path: dist/, if-no-files-found: error }

  macos:
    name: Mac binaries, app and disk image
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        run: |
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain login.keychain # where codesign looks for the identity
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 7200 build.keychain # stays unlocked through notarization
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      # Both architectures with cgo (Intel is cross-compiled by Apple's clang),
      # plus a universal Mirrin.app in the disk image. Signed with the
      # Developer ID and notarized when the APPLE_* secrets are set; ad-hoc
      # signed, with a notice, when they aren't (see the script).
      - run: scripts/release-macos.sh
        env:
          VERSION: ${{ github.ref_name }}
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Remove the signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain build.keychain || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: |
            dist/mirrin-darwin-amd64
            dist/mirrin-darwin-arm64
            dist/mirrin-darwin-amd64-nowhatsapp
            dist/mirrin-darwin-arm64-nowhatsapp
            dist/Mirrin-*-macos.dmg
          if-no-files-found: error

  # whisper-server and sox for one-click voice setup, built on each kind of
  # machine from pinned sources (make voice-bundle), then checked and summed
  # with everything else.
  voice:
    name: Voice bundle for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, so the bundles run on older
          # distributions' glibc too (Debian 12, Ubuntu 22.04).
          - { name: Linux x64, os: ubuntu-22.04 }
          - { name: Linux arm64, os: ubuntu-22.04-arm }
          - { name: Mac with Apple silicon, os: macos-latest }
          - { name: Intel Mac, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q cmake libasound2-dev
          else
            command -v cmake >/dev/null || brew install cmake
          fi
      - run: make voice-bundle
      - id: name
        run: echo "artifact=voice-$(uname -s)-$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "${{ steps.name.outputs.artifact }}", path: "dist/mirrin-voice-*.tar.gz", if-no-files-found: error }

  windows:
    name: Windows setup
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The setup program wraps the same mirrin-windows-amd64.exe that is
      # published on its own, so there is one build of it, not two.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: portable, path: dist }
      - run: choco install innosetup -y --no-progress
      - run: iscc packaging\windows\mirrin.iss
        env: { VERSION: "${{ github.ref_name }}" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: windows, path: "dist/Mirrin-*-windows-setup.exe", if-no-files-found: error }

  # What the binaries are made of, kept apart from the job that can sign and
  # publish: the SBOM (syft reads the module list Go builds into each binary),
  # the third-party licence notices, and the source with every dependency,
  # which is what the GPL asks to go with binaries that link GPL code
  # (docs/licensing.md).
  bom:
    name: SBOM, licence notices and source
    needs: [portable, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: portable, path: "${{ runner.temp }}/bin" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: macos, path: "${{ runner.temp }}/bin" }
      - name: Third-party licence notices
        run: |
          mkdir -p dist
          go run ./scripts/licenses -versions -o dist/THIRD_PARTY_NOTICES.txt
      # Checked to build with no network and no module cache, so it really is
      # all the source.
      - name: Source with every dependency
        run: |
          name="Mirrin-$GITHUB_REF_NAME-source"
          scripts/source-archive.sh "$GITHUB_REF_NAME" "dist/$name.tar.gz"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/$name"
          GOFLAGS=-mod=vendor GOPROXY=off GOMODCACHE="$RUNNER_TEMP/empty" CGO_ENABLED=0 go build -o /dev/null ./cmd/mirrin
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
      - name: SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" scan "dir:$RUNNER_TEMP/bin" --override-default-catalogers go-module-binary-cataloger \
            --source-name Mirrin --source-version "$GITHUB_REF_NAME" \
            -o "spdx-json=dist/Mirrin-$GITHUB_REF_NAME-sbom.spdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: bom, path: dist/, if-no-files-found: error }

  publish:
    needs: [portable, macos, windows, bom, voice]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # Sigstore keyless signing and attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      # Every platform install.sh, install.ps1 and the Homebrew formula ask
      # for must be here, with the four voice bundles, and each binary must
      # be what its name says.
      - name: Check every file and write SHA256SUMS
        run: go run ./scripts/releasecheck -sums dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS with Sigstore
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      # SLSA build provenance for every file in SHA256SUMS (actions/attest is
      # what actions/attest-build-provenance wraps since its v4), then the SBOM
      # attested for the programs it describes: the CLIs, the disk image and
      # the Windows setup program, not the notices, source or SBOM files.
      # Attestations need a public repository on GitHub's free plans.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-checksums: dist/SHA256SUMS }
      - name: SBOM attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/mirrin-linux-*
            dist/mirrin-darwin-*
            dist/mirrin-windows-*
            dist/mirrin-relay-*
            dist/Mirrin-*-macos.dmg
            dist/Mirrin-*-windows-setup.exe
          sbom-path: dist/Mirrin-${{ github.ref_name }}-sbom.spdx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ !github.event.repository.private && '1' || '' }} # the notes mention attestations only when there are some
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
            --title "Mirrin $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sums, path: dist/SHA256SUMS }

  # The hosted-twin image (packaging/docker), for amd64 and arm64, from the
  # same Linux binaries the release publishes. Pushed to GHCR and signed
  # keyless with Sigstore only for a tag; any other run (a manual one on a
  # branch) builds both platforms and pushes nothing.
  image:
    name: Hosted-twin image (GHCR)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: portable, path: dist }
      - name: Image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x dist/mirrin-linux-amd64 dist/mirrin-linux-arm64
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/mirrin-twin"
          tags="$image:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push, for a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.title=Mirrin hosted twin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      # Signed by digest, so every tag of this build carries the signature.
      # Check it with: cosign verify <image> --certificate-identity
      # https://github.com/<repo>/.github/workflows/release.yml@refs/tags/<tag>
      # --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image with Sigstore
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  homebrew:
    name: Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      TAP: ${{ vars.HOMEBREW_TAP || 'MavrkAI/homebrew-tap' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: sums, path: "${{ runner.temp }}/sums" }
      - name: Update Formula/mirrin.rb
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SUMS="$RUNNER_TEMP/sums/SHA256SUMS" scripts/release-brew.sh > "$RUNNER_TEMP/mirrin.rb"
          gh auth setup-git # git push authenticates with the tap token
          gh repo clone "$TAP" "$RUNNER_TEMP/tap" -- --depth 1
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/mirrin.rb" Formula/mirrin.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mirrin.rb
          if git diff --cached --quiet; then
            echo "Formula/mirrin.rb is already at $VERSION"
          else
            git commit -m "mirrin $VERSION"
            git push
          fi
      - if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so $TAP wasn't updated. See docs/maintainers-release.md."

  # Checks what a user can check: every published file has a provenance
  # attestation from this workflow, and the binaries have the SBOM attested.
  attestations:
    name: Check the attestations
    needs: publish
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: gh attestation verify, for every file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$REPO" -D "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          while read -r _ f; do
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml" </dev/null
          done < SHA256SUMS
          gh attestation verify mirrin-linux-amd64 -R "$REPO" --predicate-type https://spdx.dev/Document/v2.3

  # Installs the published release the way users do, on every kind of machine
  # there is a build for, then asks `mirrin update` about it. Downloads need a
  # public repository.
  smoke:
    name: Install on ${{ matrix.name }}
    needs: publish
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, so the bundles run on older
          # distributions' glibc too (Debian 12, Ubuntu 22.04).
          - { name: Linux x64, os: ubuntu-22.04 }
          - { name: Linux arm64, os: ubuntu-22.04-arm }
          - { name: Mac with Apple silicon, os: macos-latest }
          - { name: Intel Mac, os: macos-15-intel }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      MIRRIN_VERSION: ${{ github.ref_name }}
      MIRRIN_REPO: ${{ github.repository }}
      MIRRIN_NO_APP: "1"
      MIRRIN_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With cosign installed, install.sh also checks the Sigstore signature.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: runner.os != 'Windows'
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash # -o pipefail, so a failed install fails the step
        env:
          MIRRIN_BIN_DIR: ${{ runner.temp }}/bin
          GH_TOKEN: ${{ github.token }}
        run: |
          sh install.sh | tee "$RUNNER_TEMP/install.log"
          grep -q "signature verified" "$RUNNER_TEMP/install.log"
          "$MIRRIN_BIN_DIR/mirrin" version | grep -F "$MIRRIN_VERSION"
          # `mirrin update --check` must agree with GitHub about the latest
          # release: this one, or (a pre-release, or a patch to an older line
          # published after a newer release) the one GitHub marks as latest.
          latest=$(gh api "repos/$MIRRIN_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$MIRRIN_VERSION" in
            "$latest") "$MIRRIN_BIN_DIR/mirrin" update --check | grep -F "You have the latest Mirrin ($MIRRIN_VERSION)" ;;
            *-*) ;; # a pre-release is newer than the latest release, or older than it
            *) if [ -n "$latest" ]; then "$MIRRIN_BIN_DIR/mirrin" update --check | grep -F "Mirrin $latest is available"; fi ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.name == 'Linux x64'
        with: { go-version-file: go.mod }
      - name: Install and verify MIT build
        if: matrix.name == 'Linux x64'
        shell: bash
        env:
          MIRRIN_BUILD: nowhatsapp
          MIRRIN_BIN_DIR: ${{ runner.temp }}/mit-bin
        run: |
          sh install.sh | tee "$RUNNER_TEMP/mit-install.log"
          grep -q "signature verified" "$RUNNER_TEMP/mit-install.log"
          "$MIRRIN_BIN_DIR/mirrin" version | grep -F "$MIRRIN_VERSION"
          go version -m "$MIRRIN_BIN_DIR/mirrin" > "$RUNNER_TEMP/mit-buildinfo"
          grep -q 'nowhatsapp' "$RUNNER_TEMP/mit-buildinfo"
          if grep -q 'go.mau.fi/' "$RUNNER_TEMP/mit-buildinfo"; then
            echo "The MIT download contains WhatsApp dependencies."
            exit 1
          fi
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MIRRIN_BIN_DIR: ${{ runner.temp }}\bin
          GH_TOKEN: ${{ github.token }}
        run: |
          ./install.ps1
          $v = & "$env:MIRRIN_BIN_DIR\mirrin.exe" version
          if ($v -notmatch [regex]::Escape($env:MIRRIN_VERSION)) { throw "installed '$v', want $env:MIRRIN_VERSION" }
          # As in the install.sh step: this release, or the one GitHub marks as latest.
          $latest = gh api "repos/$env:MIRRIN_REPO/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0) { $latest = '' }
          $global:LASTEXITCODE = 0
          $want = ''
          if ($latest -eq $env:MIRRIN_VERSION) { $want = "You have the latest Mirrin ($env:MIRRIN_VERSION)" }
          elseif ($latest -and $env:MIRRIN_VERSION -notmatch '-') { $want = "Mirrin $latest is available" }
          if ($want) {
            $u = (& "$env:MIRRIN_BIN_DIR\mirrin.exe" update --check) -join "`n"
            if ($u -notmatch [regex]::Escape($want)) { throw "mirrin update --check said: $u" }
          }
