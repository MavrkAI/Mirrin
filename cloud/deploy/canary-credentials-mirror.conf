# Drop-in: /etc/systemd/system/mirrin-canary@mirror.service.d/credentials.conf
# Write access to the deny-list bucket, and nothing else.
[Service]
LoadCredentialEncrypted=MIRROR_ACCESS_KEY_ID:/etc/credstore.encrypted/MIRROR_ACCESS_KEY_ID
LoadCredentialEncrypted=MIRROR_SECRET_ACCESS_KEY:/etc/credstore.encrypted/MIRROR_SECRET_ACCESS_KEY
