# Drop-in: /etc/systemd/system/mirrin-canary@watch.service.d/credentials.conf
# The probe token, the pager's routing key and the mail login.
[Service]
LoadCredentialEncrypted=CANARY_PROBE_TOKEN:/etc/credstore.encrypted/CANARY_PROBE_TOKEN
LoadCredentialEncrypted=PAGERDUTY_ROUTING_KEY:/etc/credstore.encrypted/PAGERDUTY_ROUTING_KEY
LoadCredentialEncrypted=SMTP_USERNAME:/etc/credstore.encrypted/SMTP_USERNAME
LoadCredentialEncrypted=SMTP_PASSWORD:/etc/credstore.encrypted/SMTP_PASSWORD
