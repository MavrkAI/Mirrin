# openWakeWord training config for "hey maverick". The paths are in the
# default home, ~/.mirrin; change them if you set MIRRIN_HOME.
model_name: hey_maverick
target_phrase: ["hey maverick"]
custom_negative_phrases: []
n_samples: 600
n_samples_val: 100
output_dir: ~/.mirrin/wake
piper_sample_generator_path: ~/.mirrin/wake/piper_stub
tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 3
background_paths: ["~/.mirrin/wake/hey_maverick/background"]
background_paths_duplication_rate: [1]
rir_paths: ["~/.mirrin/wake/hey_maverick/rir"]
false_positive_validation_data_path: ~/.mirrin/wake/validation_set_features.npy
feature_data_files:
  ACAV100M_sample: ~/.mirrin/wake/openwakeword_features_ACAV100M_2000_hrs_16bit.npy
batch_n_per_class:
  ACAV100M_sample: 1024
  adversarial_negative: 50
  positive: 50
model_type: dnn
layer_size: 32
steps: 20000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
